channels:
  eyebrow: Signal archive
  title: Products are only one kind of signal.
  body: The expedition will publish field notes, tool shelves, reference folders, and build logs from the things we test in deep space.
  items:
    - key: notes
      title: Field Notes
      description: Essays, technical notebooks, product observations, and strange learnings recovered from agentic experiments.
      status: First transmission soon
    - key: tools
      title: Tool Shelf
      description: Software, keyboards, editors, workflows, and products that survive the journey long enough to be remembered.
      status: Curating instruments
    - key: collections
      title: Folders
      description: Reference folders for prompts, demos, papers, screenshots, and handmade technical artifacts.
      status: Opening the archive
    - key: logs
      title: Build Logs
      description: "Short records from missions: what launched, what burned up, what dived too deep, and what came back useful."
      status: Always recording
