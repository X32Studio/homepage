studio:
  kicker: Mission crew
  title: Two people, one vessel, unusual range.
  body: X32 Studio is a compact deep-space craft. One founder navigates agentic algorithms and engineering systems; the other maps product direction, user journeys, and signal from noise. Small crew, long-range instruments.
  principles:
    - Explore before optimizing
    - Build instruments, not dashboards
    - Keep agentic systems observable
    - Turn field notes into useful artifacts
labsIntro:
  eyebrow: Mission modules
  title: Three modules for the X32 expedition.
  body: "Each module handles a different distance from the unknown: deep engineering, friendly onboarding, and agentic automation."
about:
  eyebrow: Crew manifest
  title: A family crew building instruments for the unknown.
  body: "We combine algorithmic depth with product clarity. The mission format lets us stay close to the work: observe, prototype, launch, record, recover, and refine."
  capabilities:
    - Agentic algorithm design
    - Product strategy and user journeys
    - Full-stack prototypes
    - Technical storytelling
links:
