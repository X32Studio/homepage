studio:
  kicker: What we are
  title: Tiny company, high agency.
  body: X32 Studio is intentionally small. One founder goes deep on agentic algorithms and engineering systems; the other shapes products, positioning, and user experience. The result is a studio that can move from idea to artifact without losing the plot.
  principles:
    - Dense craft over headcount
    - Products that teach while they work
    - Agentic systems with visible edges
    - Tasteful interfaces for technical ideas
labsIntro:
  eyebrow: Product lines
  title: Three labs, one studio operating system.
  body: Each lab is a shelf for ongoing products and experiments. New entries can be added through content files without redesigning the site.
about:
  eyebrow: About
  title: Built by a couple who like hard problems and useful software.
  body: We combine algorithmic depth with product clarity. The studio format lets us stay close to the work: research, prototype, write, ship, learn, and refine.
  capabilities:
    - Agentic algorithm design
    - Product strategy and user journeys
    - Full-stack prototypes
    - Technical storytelling
