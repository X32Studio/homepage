studio:
  kicker: 船员组
  title: 两个人，一艘船，很远的航程。
  body: X32 Studio 像一艘紧凑的深空飞船。一位创始人负责 agentic 算法与工程系统导航，另一位负责产品方向、用户路径和信号判断。小船员组，长距离仪器。
  principles:
    - 先探索，再优化
    - 做仪器，不做噪音面板
    - 让 agentic 系统保持可观测
    - 把航行笔记变成可用作品
labsIntro:
  eyebrow: 任务模块
  title: X32 远征队的三个任务模块。
  body: 每个模块对应一种靠近未知的距离：深度工程、友好入门、agentic 自动化。
about:
  eyebrow: 船员档案
  title: 一个家庭船员组，为未知领域制造仪器。
  body: 我们把算法深度和产品清晰度放在一起。任务式工作让我们始终靠近真实现场：观测、原型、发射、记录、回收、迭代。
  capabilities:
    - Agentic 算法设计
    - 产品策略与用户路径
    - 全栈原型开发
    - 技术叙事与表达
links:
  title: 地面信号
  items:
    - label: GitHub
      href: https://github.com/x32studio
      note: 代码、实验、任务模块和开源作品
    - label: Email
      href: mailto:hello@x32studio.com
