channels:
  eyebrow: 信号档案
  title: 产品只是我们发回来的信号之一。
  body: 这次远征会持续发布航行笔记、工具架、参考文件夹和构建日志，记录我们在深空里测试过的东西。
  items:
    - key: notes
      title: Field Notes
      description: 从 agentic 实验里回收的文章、技术笔记、产品观察和奇怪发现。
      status: 第一批信号即将发出
    - key: tools
      title: Tool Shelf
      description: 经得起航行的软件、键盘、编辑器、工作流和产品。
      status: 仪器整理中
    - key: collections
      title: Folders
      description: prompt、demo、论文、截图和手作技术素材的参考文件夹。
      status: 档案即将开放
    - key: logs
      title: Build Logs
      description: 任务短记录：哪些发射了，哪些烧毁了，哪些潜得太深，哪些最后带回了价值。
      status: 持续记录中
footer:
  tagline: 两个人船员组，从深空带回有用工具。
